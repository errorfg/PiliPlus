# 鸿蒙构建时并入 pubspec.yaml 的依赖（只含 dependencies 与 dependency_overrides）。
# 同名条目替换 pubspec.yaml 里的条目。其他平台的构建不读取本文件。
# dependencies：只含鸿蒙实现的包，面向应用的包仍用 pubspec.yaml 里的版本。
# dependency_overrides：鸿蒙实现写在面向应用的包里，整包换成鸿蒙分支。
dependencies:
  path_provider_ohos:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_packages.git
      path: packages/path_provider/path_provider_ohos
      ref: a0e6cebef8ca58767fcd6d2afdedc3fa1b5a88c1
  # 画中画的鸿蒙原生实现；Dart 端用 lib/utils/ohos/ohos_pip.dart，不引用这个包的 Dart 代码
  floating:
